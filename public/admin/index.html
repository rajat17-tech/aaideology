<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaideology Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #ec4899;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --dark: #1e1b4b;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      width: 260px;
      height: 100vh;
      background: linear-gradient(180deg, var(--dark) 0%, #312e81 100%);
      color: white;
      z-index: 1000;
      overflow-y: auto;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-header h1 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-header h1 i { color: var(--primary); }
    .sidebar-header p {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
      padding-left: 34px;
    }
    .nav-menu { padding: 16px 12px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .nav-item.active {
      background: var(--primary);
      box-shadow: 0 4px 12px rgba(99,102,241,0.4);
    }
    .nav-item i { width: 20px; text-align: center; }

    /* Main Content */
    .main-content {
      margin-left: 260px;
      min-height: 100vh;
    }
    .top-bar {
      background: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--gray-200);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar h2 { font-size: 22px; font-weight: 700; color: var(--gray-900); }
    .top-bar-actions { display: flex; gap: 12px; align-items: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-700);
      border: 1px solid var(--gray-200);
    }
    .btn-secondary:hover { background: var(--gray-200); }
    .btn-sm { padding: 6px 14px; font-size: 13px; }

    .content-area { padding: 24px 32px; }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--gray-100);
    }
    .stat-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .stat-card-icon {
      width: 48px; height: 48px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .stat-card-icon.purple { background: #ede9fe; color: var(--primary); }
    .stat-card-icon.pink { background: #fce7f3; color: var(--secondary); }
    .stat-card-icon.green { background: #dcfce7; color: var(--success); }
    .stat-card-icon.orange { background: #fef3c7; color: var(--warning); }
    .stat-card h3 { font-size: 32px; font-weight: 700; color: var(--gray-900); }
    .stat-card p { font-size: 14px; color: var(--gray-500); margin-top: 4px; }

    /* Cards */
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--gray-100);
      overflow: hidden;
    }
    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header h3 { font-size: 16px; font-weight: 600; }
    .card-body { padding: 24px; }

    /* Tables */
    .table-container { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      text-align: left;
      padding: 14px 16px;
      font-weight: 600;
      color: var(--gray-600);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--gray-50);
      border-bottom: 2px solid var(--gray-200);
    }
    td {
      padding: 16px;
      border-bottom: 1px solid var(--gray-100);
      vertical-align: middle;
    }
    tr:hover td { background: var(--gray-50); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-gray { background: var(--gray-100); color: var(--gray-600); }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-purple { background: #ede9fe; color: #5b21b6; }
    .badge-orange { background: #ffedd5; color: #9a3412; }

    /* Forms */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
    }
    .form-group label .required { color: var(--danger); }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
      background: white;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    textarea.form-control { min-height: 120px; resize: vertical; }
    select.form-control { cursor: pointer; }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: var(--radius);
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: modalSlide 0.3s ease;
    }
    @keyframes modalSlide {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 18px; font-weight: 700; }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--gray-100);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { background: var(--gray-200); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--gray-100);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Toggle Switch */
    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--gray-300);
      border-radius: 24px;
      transition: 0.3s;
    }
    .toggle-slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
      box-shadow: var(--shadow-sm);
    }
    .toggle input:checked + .toggle-slider { background: var(--success); }
    .toggle input:checked + .toggle-slider:before { transform: translateX(20px); }

    /* Preview Section */
    .preview-box {
      background: var(--gray-50);
      border: 2px dashed var(--gray-300);
      border-radius: var(--radius-sm);
      padding: 40px;
      text-align: center;
      margin-top: 16px;
    }
    .preview-box h4 { color: var(--gray-400); font-size: 14px; }

    /* Section Preview in Table */
    .section-preview {
      width: 60px;
      height: 40px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gray-200);
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: white;
      border-radius: var(--radius-sm);
      padding: 14px 20px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 300px;
      animation: toastSlide 0.3s ease;
      border-left: 4px solid var(--success);
    }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }
    @keyframes toastSlide {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state i {
      font-size: 48px;
      color: var(--gray-300);
      margin-bottom: 16px;
    }
    .empty-state h4 { color: var(--gray-600); margin-bottom: 8px; }
    .empty-state p { color: var(--gray-400); font-size: 14px; }

    /* Color Picker wrapper */
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-picker-wrapper input[type="color"] {
      width: 44px;
      height: 36px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      cursor: pointer;
      padding: 2px;
    }

    /* Drag handle */
    .drag-handle {
      cursor: grab;
      color: var(--gray-400);
      padding: 4px;
    }
    .drag-handle:active { cursor: grabbing; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
    }

    /* Tab system */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 2px solid var(--gray-100);
      margin-bottom: 24px;
    }
    .tab {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-500);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }
    .tab:hover { color: var(--primary); }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Cards grid for card-type sections */
    .cards-grid-preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .card-item-form {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 16px;
      position: relative;
    }
    .card-item-form .remove-card {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: var(--danger);
      color: white;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loginScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--dark) 0%, var(--primary-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow-md);
    }
    .login-card h1 {
      font-size: 1.3rem;
      color: var(--dark);
      margin-bottom: 4px;
      text-align: center;
    }
    .login-card p.subtitle {
      color: var(--gray-500);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 24px;
    }
    .login-error {
      display: none;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    #appContainer { display: none; }
  </style>
</head>
<body>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="login-card">
      <h1><i class="fas fa-cube"></i> Aaideology Admin</h1>
      <p class="subtitle">Sign in to manage the website</p>
      <div class="login-error" id="loginError"></div>
      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" id="loginUsername" autocomplete="username" value="admin">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="loginPassword" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;" onclick="doLogin()">
          <i class="fas fa-sign-in-alt"></i> Log In
        </button>
      </form>
    </div>
  </div>

  <div id="appContainer">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><i class="fas fa-cube"></i> Aaideology</h1>
      <p>Admin Dashboard</p>
    </div>
    <nav class="nav-menu">
      <div class="nav-item active" onclick="showPage('dashboard')">
        <i class="fas fa-chart-pie"></i> Dashboard
      </div>
      <div class="nav-item" onclick="showPage('sections')">
        <i class="fas fa-layer-group"></i> Sections
      </div>
      <div class="nav-item" onclick="showPage('jobs')">
        <i class="fas fa-briefcase"></i> Jobs
      </div>
      <div class="nav-item" onclick="showPage('reviews')">
        <i class="fas fa-star"></i> Reviews
      </div>
      <div class="nav-item" onclick="showPage('posters')">
        <i class="fas fa-bullhorn"></i> Latest Updates
      </div>
      <div class="nav-item" onclick="showPage('navbar')">
        <i class="fas fa-bars"></i> Navigation
      </div>
      <div class="nav-item" onclick="showPage('content')">
        <i class="fas fa-file-alt"></i> Site Content
      </div>
      <div class="nav-item" onclick="showPage('preview')">
        <i class="fas fa-eye"></i> Live Preview
      </div>
      <div class="nav-item" onclick="window.open('/', '_blank')">
        <i class="fas fa-external-link-alt"></i> Visit Website
      </div>
      <div class="nav-item" onclick="doLogout()">
        <i class="fas fa-sign-out-alt"></i> Log Out
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Top Bar -->
    <div class="top-bar">
      <h2 id="pageTitle">Dashboard</h2>
      <div class="top-bar-actions">
        <span style="color: var(--gray-400); font-size: 13px;"><i class="fas fa-circle" style="color: var(--success); font-size: 8px; margin-right: 6px;"></i>Server Online</span>
      </div>
    </div>

    <div class="content-area" id="contentArea">
      <!-- Content injected by JS -->
    </div>
  </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Section</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Modal content injected by JS -->
      </div>
      <div class="modal-footer" id="modalFooter">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="modalSaveBtn" onclick="saveSection()">Save Section</button>
      </div>
    </div>
  </div>

  <script>
    // ===================== STATE =====================
    let sections = [];
    let navbarItems = [];
    let siteContent = {};
    let jobs = [];
    let posters = [];
    let reviews = [];
    let editingSectionId = null;
    let editingJobId = null;
    let editingReviewId = null;
    let cardCount = 0;

    // ===================== CSRF =====================
    // Populated from /api/auth/status (and refreshed on login) — sent back
    // on every state-changing admin request so the server can verify the
    // request actually originated from this admin panel (see middleware/auth.js).
    let csrfToken = null;
    function writeHeaders(extra) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
      if (csrfToken) headers['X-CSRF-Token'] = csrfToken;
      return headers;
    }

    // ===================== API =====================
    const API = {
      async getSections() {
        const res = await fetch('/api/sections');
        return res.json();
      },
      async createSection(data) {
        const res = await fetch('/api/sections', {
          method: 'POST',
          headers: writeHeaders(),
          body: JSON.stringify(data)
        });
        return handleWriteResponse(res);
      },
      async updateSection(id, data) {
        const res = await fetch(`/api/sections/${id}`, {
          method: 'PUT',
          headers: writeHeaders(),
          body: JSON.stringify(data)
        });
        return handleWriteResponse(res);
      },
      async deleteSection(id) {
        const res = await fetch(`/api/sections/${id}`, { method: 'DELETE', headers: writeHeaders() });
        return handleWriteResponse(res);
      },
      async reorderSections(orders) {
        const res = await fetch('/api/sections/reorder', {
          method: 'POST',
          headers: writeHeaders(),
          body: JSON.stringify({ orders })
        });
        return handleWriteResponse(res);
      },
      async getNavbar() {
        const res = await fetch('/api/navbar');
        return res.json();
      },
      async updateNavbar(items) {
        const res = await fetch('/api/navbar', {
          method: 'PUT',
          headers: writeHeaders(),
          body: JSON.stringify(items)
        });
        return handleWriteResponse(res);
      },
      async getJobs() {
        const res = await fetch('/api/jobs');
        return res.json();
      },
      async createJob(data) {
        const res = await fetch('/api/jobs', {
          method: 'POST',
          headers: writeHeaders(),
          body: JSON.stringify(data)
        });
        return handleWriteResponse(res);
      },
      async updateJob(id, data) {
        const res = await fetch(`/api/jobs/${id}`, {
          method: 'PUT',
          headers: writeHeaders(),
          body: JSON.stringify(data)
        });
        return handleWriteResponse(res);
      },
      async deleteJob(id) {
        const res = await fetch(`/api/jobs/${id}`, { method: 'DELETE', headers: writeHeaders() });
        return handleWriteResponse(res);
      },
      async getPosters() {
        const res = await fetch('/api/posters');
        return res.json();
      },
      async deletePoster(id) {
        const res = await fetch(`/api/posters/${id}`, { method: 'DELETE', headers: writeHeaders() });
        return handleWriteResponse(res);
      },
      async getSiteContent() {
        const res = await fetch('/api/content');
        return res.json();
      },
      async updateSiteContent(data) {
        const res = await fetch('/api/content', {
          method: 'PUT',
          headers: writeHeaders(),
          body: JSON.stringify(data)
        });
        return handleWriteResponse(res);
      },
      async getAllReviews() {
        const res = await fetch('/api/reviews/all', { headers: writeHeaders() });
        return handleWriteResponse(res);
      },
      async createReview(data) {
        const res = await fetch('/api/reviews/admin', {
          method: 'POST',
          headers: writeHeaders(),
          body: JSON.stringify(data)
        });
        return handleWriteResponse(res);
      },
      async updateReview(id, data) {
        const res = await fetch(`/api/reviews/${id}`, {
          method: 'PUT',
          headers: writeHeaders(),
          body: JSON.stringify(data)
        });
        return handleWriteResponse(res);
      },
      async deleteReview(id) {
        const res = await fetch(`/api/reviews/${id}`, { method: 'DELETE', headers: writeHeaders() });
        return handleWriteResponse(res);
      }

    // ===================== HTML ESCAPING =====================
    // Every piece of admin- or visitor-supplied text that gets inserted via
    // innerHTML below must go through this first — otherwise a job title,
    // section title, poster caption, etc. containing "<script>" would run
    // for every admin who opens this dashboard (stored XSS).
    function escapeHtml(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    // Same rationale as public/js/main.js — color values get interpolated
    // directly into style="" attributes, so escapeHtml alone isn't enough.
    const SAFE_CSS_COLOR = /^(#[0-9a-fA-F]{3,8}|rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)|rgba\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*[\d.]+\s*\)|[a-zA-Z]{3,20})$/;
    function sanitizeCssColor(value) {
      if (typeof value !== 'string') return '';
      const trimmed = value.trim();
      return SAFE_CSS_COLOR.test(trimmed) ? trimmed : '';
    }

    // Shared handler for all write requests: throws with a readable message
    // on failure, and if the session expired (401) bounces back to the
    // login screen so it's obvious why the save didn't work.
    async function handleWriteResponse(res) {
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        if (res.status === 401) {
          showLoginScreen();
          throw new Error('Your session expired — please log in again.');
        }
        throw new Error(err.error || 'Request failed');
      }
      return res.json();
    }

    // ===================== TOAST =====================

      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle';
      toast.innerHTML = `<i class="fas fa-${icon}" style="color: var(--${type === 'success' ? 'success' : type === 'error' ? 'danger' : 'warning'});"></i><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // ===================== HELPERS =====================
    function getTypeIcon(type) {
      const icons = {
        text: 'align-left',
        image: 'image',
        cards: 'th-large',
        stats: 'chart-bar',
        team: 'users',
        testimonials: 'quote-left',
        custom: 'code'
      };
      return icons[type] || 'cube';
    }

    function showPage(pageName) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('pageTitle').textContent = pageName.charAt(0).toUpperCase() + pageName.slice(1);
      document.getElementById('contentArea').innerHTML = pages[pageName] ? pages[pageName]() : '<p>Page not found</p>';
    }

    function switchTab(tabEl, panelId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      tabEl.classList.add('active');
      document.getElementById(panelId).classList.add('active');
    }

    // ===================== MODAL =====================

      document.getElementById('modalSaveBtn').setAttribute('onclick', 'saveSection()');

          <div class="tab" onclick="switchTab(this, 'tab-cards')" id="tab-cards-header" style="display:${['cards','stats','team','testimonials'].includes(section?.type) || !editId ? 'block' : 'none'}">Cards</div>

            <div class="form-group">
              <label>Section Title <span class="required">*</span></label>
              <input type="text" class="form-control" id="secTitle" value="${section?.title || ''}" placeholder="e.g., About Us">
            </div>
          </div>
          <div class="form-group">
            <label>Subtitle</label>
            <input type="text" class="form-control" id="secSubtitle" value="${section?.subtitle || ''}" placeholder="Optional subtitle">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Section Type</label>
              <select class="form-control" id="secType" onchange="onTypeChange()">

                <option value="team" ${section?.type === 'team' ? 'selected' : ''}>Team Members</option>

    async function moveSection(id, direction) {
      const idx = sections.findIndex(s => s.id === id);
      if (idx === -1) return;

      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= sections.length) return;

      const orders = {};
      const sorted = [...sections].sort((a, b) => a.order - b.order);

      // Swap orders
      const temp = sorted[idx].order;
      sorted[idx].order = sorted[newIdx].order;
      sorted[newIdx].order = temp;

      sorted.forEach(s => { orders[s.id] = s.order; });

      try {
        await API.reorderSections(orders);
        showToast('Section order updated');
        await loadData();
        showPage('sections');
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    async function uploadPoster() {
      if (!chosenPosterFile) {
        showToast('Please choose an image first.', 'error');
        return;
      }

      const btn = document.getElementById('posterUploadBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

      const fd = new FormData();
      fd.append('poster', chosenPosterFile);
      fd.append('caption', document.getElementById('posterCaptionInput').value.trim());

      try {
        // Do NOT set Content-Type here — the browser must set its own
        // multipart/form-data boundary for FormData bodies.
        const uploadHeaders = csrfToken ? { 'X-CSRF-Token': csrfToken } : {};
        const res = await fetch('/api/posters', { method: 'POST', headers: uploadHeaders, body: fd });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          if (res.status === 401) { showLoginScreen(); throw new Error('Your session expired — please log in again.'); }
          throw new Error(err.error || 'Upload failed');
        }
        showToast('Update uploaded successfully!');
        chosenPosterFile = null;
        await loadData();
        showPage('posters');
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-upload"></i> Upload';
      }
    }

        visible: document.getElementById('contactVisible').checked
      };

      const footer = {
        companyName: document.getElementById('footerCompanyInput').value,
        tagline: document.getElementById('footerTaglineInput').value,
        copyright: document.getElementById('footerCopyrightInput').value
      };

      const data = { hero, stats, about, values, services, serviceList, industries, contact, footer };

      try {
        await API.updateSiteContent(data);
        showToast('Site content saved!');
        await loadData();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    // ===================== DATA LOADING =====================
    async function loadData() {
      try {
        [sections, navbarItems, siteContent, jobs, posters, reviews] = await Promise.all([
          API.getSections(),
          API.getNavbar(),
          API.getSiteContent(),
          API.getJobs(),
          API.getPosters(),
          API.getAllReviews()
        ]);
      } catch (err) {
        showToast('Failed to load data: ' + err.message, 'error');
      }
    }

    // ===================== AUTH =====================
    async function checkAuthStatus() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (data.loggedIn && data.csrfToken) csrfToken = data.csrfToken;
        return !!data.loggedIn;
      } catch (err) {
        return false;
      }
    }

    function showLoginScreen() {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appContainer').style.display = 'none';
    }

    async function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appContainer').style.display = 'block';
      await loadData();
      document.getElementById('contentArea').innerHTML = pages.dashboard();
    }

    async function doLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errBox = document.getElementById('loginError');
      errBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        if (data.csrfToken) csrfToken = data.csrfToken;
        await showApp();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      }
    }

    async function doLogout() {
      await fetch('/api/auth/logout', { method: 'POST', headers: writeHeaders() });
      csrfToken = null;
      showLoginScreen();
    }

    // Allow pressing Enter in the password field to submit
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('loginPassword')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
      });
    });

    // ===================== INIT =====================
    async function init() {
      const loggedIn = await checkAuthStatus();
      if (loggedIn) {
        await showApp();
      } else {
        showLoginScreen();
      }
    }

    init();
  </script>
</body>
</html>
